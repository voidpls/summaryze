<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Summaryze</title>
    <meta name="description" content="AI Text and YouTube Video Summarizer">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Summaryze">
    <meta property="og:description" content="AI Text and YouTube Video Summarizer">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "IBM Plex Sans", system-ui, sans-serif;
            background: #0f0f0f;
            color: #ededed;
            min-height: 100vh;
            padding: 36px 20px 56px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1320px; margin: 0 auto; }

        header { margin-bottom: 24px; }
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #8a8a8a;
            font-size: 0.95rem;
        }

        .mode-switch {
            display: inline-grid;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 24px;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            background: #141414;
        }
        .mode {
            position: relative;
            cursor: pointer;
            text-align: center;
            padding: 9px 20px;
            font-size: 0.9rem;
            color: #8a8a8a;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .mode input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
        .mode:has(input:checked) {
            background: #222;
            color: #ededed;
        }
        .mode:has(input:focus-visible) {
            outline: 2px solid #ededed;
            outline-offset: -2px;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(300px, 0.85fr) minmax(0, 1.35fr);
            gap: 20px;
            align-items: stretch;
        }
        .panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 480px;
            padding: 16px;
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
        }
        .panel-label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #8a8a8a;
        }

        textarea {
            width: 100%;
            min-height: 56px;
            padding: 12px;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            background: #111;
            color: #ededed;
            font: inherit;
            font-size: 0.95rem;
            line-height: 1.55;
            resize: vertical;
        }
        textarea.large {
            flex: 1;
            min-height: 240px;
        }
        textarea::placeholder { color: #555; }
        textarea:focus {
            outline: none;
            border-color: #555;
        }

        #video-container { display: none; }
        #video-container iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            border: 0;
            border-radius: 8px;
            background: #000;
        }

        button#summarize-btn {
            align-self: flex-start;
            margin-top: 4px;
            padding: 10px 16px;
            border: 1px solid #ededed;
            border-radius: 8px;
            background: #ededed;
            color: #0f0f0f;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
        }
        button#summarize-btn:hover:not(:disabled) { background: #fff; }
        button#summarize-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid #0f0f0f;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error {
            display: none;
            color: #e07070;
            font-size: 0.9rem;
        }

        #output-area {
            flex: 1;
            min-height: 320px;
            padding: 4px 4px 8px;
            background: transparent;
            overflow-y: auto;
            color: #dcdcdc;
            font-size: 1rem;
            line-height: 1.7;
        }
        #output-area:empty::before {
            content: "Summary will show here";
            color: #555;
        }
        #output-area h1,
        #output-area h2,
        #output-area h3 {
            color: #ededed;
            font-weight: 600;
            margin: 0.9em 0 0.35em;
            line-height: 1.3;
        }
        #output-area h1 { font-size: 1.35em; margin-top: 0.6em; }
        #output-area h2 { font-size: 1.15em; }
        #output-area h3 { font-size: 1.05em; }
        #output-area p,
        #output-area ul,
        #output-area ol { margin-bottom: 0.9em; }
        #output-area ul,
        #output-area ol { padding-left: 1.2em; }
        #output-area li { margin-bottom: 0.35em; }
        #output-area code {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.88em;
            background: #1c1c1c;
            padding: 0.1em 0.3em;
            border-radius: 4px;
        }
        #output-area pre {
            background: #1c1c1c;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin-bottom: 1em;
        }
        #output-area pre code { background: none; padding: 0; }
        #output-area blockquote {
            border-left: 2px solid #444;
            padding-left: 14px;
            margin: 1em 0;
            color: #9a9a9a;
        }
        #output-area strong { color: #fff; font-weight: 600; }

        @media (max-width: 768px) {
            .workspace { grid-template-columns: 1fr; }
            .panel { min-height: 0; }
            textarea.large { min-height: 180px; }
            #output-area { min-height: 240px; font-size: 0.98rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Summaryze</h1>
            <p class="subtitle">Text and YouTube summarization</p>
        </header>

        <div class="mode-switch" role="radiogroup" aria-label="Input type">
            <label class="mode">
                <input type="radio" name="inputType" value="youtube" checked>
                <span>YouTube</span>
            </label>
            <label class="mode">
                <input type="radio" name="inputType" value="text">
                <span>Text</span>
            </label>
        </div>

        <div class="workspace">
            <section class="panel">
                <label class="panel-label" id="input-label" for="input-area">YouTube URL</label>
                <textarea 
                    id="input-area"
                    placeholder="https://www.youtube.com/watch?v=..."></textarea>
                <div id="video-container"></div>
                <button id="summarize-btn" type="button" onclick="summarize()">Summarize</button>
                <div class="error" id="error" role="alert"></div>
            </section>

            <section class="panel">
                <div class="panel-label">Summary</div>
                <div id="output-area"></div>
            </section>
        </div>
    </div>

    <script>
        const inputTypeRadios = document.querySelectorAll('input[name="inputType"]');
        const inputArea = document.getElementById('input-area');
        const inputLabel = document.getElementById('input-label');
        const outputArea = document.getElementById('output-area');
        const summarizeBtn = document.getElementById('summarize-btn');
        const errorDiv = document.getElementById('error');
        const videoContainer = document.getElementById('video-container');

        inputTypeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'youtube') {
                    inputLabel.textContent = 'YouTube URL';
                    inputArea.placeholder = 'https://www.youtube.com/watch?v=...';
                    inputArea.classList.remove('large');
                } else {
                    inputLabel.textContent = 'Text';
                    inputArea.placeholder = 'Paste your text here...';
                    inputArea.classList.add('large');
                    videoContainer.style.display = 'none';
                }
                inputArea.value = '';
                outputArea.innerHTML = '';
                errorDiv.style.display = 'none';
            });
        });

        function getYoutubeVideoId(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regex);
            return match ? match[1] : null;
        }

        async function summarize() {
            const inputType = document.querySelector('input[name="inputType"]:checked').value;
            const inputValue = inputArea.value.trim();

            if (!inputValue) {
                showError('Please enter some content to summarize');
                return;
            }

            errorDiv.style.display = 'none';
            summarizeBtn.innerHTML = '<span class="spinner"></span>';
            summarizeBtn.disabled = true;
            outputArea.innerHTML = '';

            // Embed YouTube video if processing a YouTube URL
            if (inputType === 'youtube') {
                const videoId = getYoutubeVideoId(inputValue);
                if (videoId) {
                    videoContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
                    videoContainer.style.display = 'block';
                }
            } else {
                videoContainer.style.display = 'none';
            }

            try {
                const endpoint = inputType === 'text' ? '/summarize/text' : '/summarize/youtube';
                const body = inputType === 'text' 
                    ? { text: inputValue }
                    : { url: inputValue };

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(body)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to generate summary');
                }

                const data = await response.json();
                outputArea.innerHTML = marked.parse(data.summary);

            } catch (error) {
                showError(error.message);
            } finally {
                summarizeBtn.innerHTML = 'Summarize';
                summarizeBtn.disabled = false;
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Initialize UI state for the default (YouTube) mode
        document.querySelector('input[name="inputType"]:checked').dispatchEvent(new Event('change'));
    </script>
</body>
</html>
